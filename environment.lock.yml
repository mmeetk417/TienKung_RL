# Fully versioned first supported environment.  The PyTorch CPU wheel index is
# used only while this environment is created; normal runs do not need network.
name: tienkung-rl
channels:
  - conda-forge
dependencies:
  - python=3.11.13
  - pip=25.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - absl-py==2.3.1
      - etils==1.13.0
      - filelock==3.18.0
      - fsspec==2025.7.0
      - glfw==2.9.0
      - grpcio==1.74.0
      - importlib-resources==6.5.2
      - jinja2==3.1.6
      - markdown==3.8.2
      - markupsafe==3.0.2
      - mpmath==1.3.0
      - mujoco==3.11.0
      - networkx==3.5
      - numpy==2.3.2
      - packaging==25.0
      - pillow==11.3.0
      - protobuf==6.32.0
      - pyopengl==3.1.10
      - pyyaml==6.0.2
      - setuptools==80.9.0
      - six==1.17.0
      - sympy==1.14.0
      - tensorboard==2.20.0
      - tensorboard-data-server==0.7.2
      - torch==2.13.0+cpu
      - typing-extensions==4.14.1
      - werkzeug==3.1.3
      - wheel==0.45.1
      - zipp==3.23.0
